version: "3.8"

services:
  backend:
    build: ./server
    container_name: mandi-advisor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep the SQLite file inside the ./data volume – the in-code default
      # (./mandi.db) lives on the container filesystem and is lost whenever
      # the container is re-created.
      DATABASE_URL: sqlite:///./data/mandi.db
    volumes:
      # Persist SQLite database across restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
